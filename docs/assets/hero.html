<script>
(function () {
  // 只在首頁（存在文章列表）插入橫幅；先載入 SVG 再插入，
  // 避免出現空容器，也避免 display 切換導致動畫被重建。
  var listing = document.querySelector("main.content .quarto-listing");
  if (!listing) return;
  if (document.querySelector(".hero-banner")) return;

  fetch("assets/banner-dark.svg")
    .then(function (r) { return r.ok ? r.text() : Promise.reject(); })
    .then(function (svg) {
      var slot = document.createElement("div");
      slot.className = "hero-banner";
      slot.setAttribute("role", "img");
      slot.setAttribute("aria-label", "知有誰 · 在霧線之上，記錄看過的事");
      slot.innerHTML = svg;

      var node = slot.querySelector("svg");
      if (node) {
        node.removeAttribute("width");
        node.removeAttribute("height");
        // meet 保留完整構圖，避免不同寬高比下被裁成變形的畫面。
        node.setAttribute("preserveAspectRatio", "xMidYMid meet");
      }

      // 以列表為錨點；若列表被重繪，改為固定在內容區頂部，
      // 這樣面板本身不會隨列表一起被移除而重播動畫。
      var anchor = document.querySelector("main.content .quarto-listing");
      if (anchor && anchor.parentNode) {
        anchor.parentNode.insertBefore(slot, anchor);
      } else {
        document.getElementById("quarto-document-content")
          .insertBefore(slot, document.getElementById("quarto-document-content").firstChild);
      }
    })
    .catch(function () { /* 載入失敗就不顯示面板，不留空框 */ });
})();
</script>
<script>
(function () {
  // Quarto 的分類欄固定輸出英文 Categories / All，這裡改成中文。
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
    "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  function localizeDate(el) {
    var text = el.textContent.trim();
    var m = text.match(/^([A-Z][a-z]{2})\s+(\d{1,2}),\s*(\d{4})$/);
    if (!m) return;
    var month = MONTHS.indexOf(m[1]) + 1;
    if (!month) return;
    el.textContent = m[3] + " 年 " + month + " 月 " + Number(m[2]) + " 日";
  }

  function localize() {
    var title = document.querySelector(".quarto-listing-category-title");
    if (title && title.textContent.trim() !== "分类") {
      title.textContent = "分类";
    }

    var all = document.querySelector('.quarto-listing-category .category[data-category=""]');
    if (all) {
      var count = all.querySelector(".quarto-category-count");
      var label = all.firstChild;
      if (label && label.nodeType === 3 && label.nodeValue.trim() !== "全部") {
        label.nodeValue = "全部 ";
      }
      if (count) all.appendChild(count);
    }

    document.querySelectorAll(".quarto-post .listing-date").forEach(localizeDate);
  }

  localize();
  window.addEventListener("load", localize);
})();
</script>
<script>
(function () {
  // 側欄推薦位：插在分類清單下方，只在首頁出現。
  var sidebar = document.getElementById("quarto-margin-sidebar");
  if (!sidebar) return;
  var categories = sidebar.querySelector(".quarto-listing-category");
  if (!categories) return;
  if (sidebar.querySelector(".promo-card")) return;

  var card = document.createElement("a");
  card.className = "promo-card";
  card.href = "https://prodclub.xyz/r/QRJT35";
  card.target = "_blank";
  card.rel = "noopener noreferrer sponsored";
  card.innerHTML =
    '<span class="promo-card__label">Sponsor</span>' +
    '<span class="promo-card__title">GPT 套餐订阅</span>' +
    '<span class="promo-card__desc">稳定的 GPT 套餐订阅服务，适合日常写作与开发使用。</span>' +
    '<span class="promo-card__cta">了解详情</span>';

  categories.parentNode.insertBefore(card, categories.nextSibling);
})();
</script>
